<title>Servicio suspendido temporalmente</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #1f2933; }
  .card { max-width: 440px; margin: 16px; padding: 40px 32px; background: #fff; border-radius: 14px;
          box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center; }
  .icon { font-size: 48px; margin-bottom: 12px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  p { margin: 0; line-height: 1.5; color: #52606d; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⏸️</div>
    <h1>Servicio suspendido temporalmente</h1>
    <p>Este sitio no está disponible por el momento.</p>
  </div>
</body>
